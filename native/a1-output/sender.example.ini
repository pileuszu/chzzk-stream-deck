# A1 NDI Sender. All delays affect only the outgoing copy.
name=A1 Desktop Sync
width=1920
height=1080
fps=30
monitor=0
# Common outgoing holdback. Total broadcast latency is intentionally allowed.
buffer_ms=500
# Positive: delay audio relative to desktop. Negative: advance its timeline.
# Zero means software-clock alignment; no unmeasured physical offset is invented.
audio_offset_ms=0
calibration_verified=false
ndi_dll=C:\Program Files\NDI\NDI 6 Tools\Runtime\Processing.NDI.Lib.x64.dll
voicemeeter_dll=C:\Program Files (x86)\VB\Voicemeeter\VoicemeeterRemote64.dll
