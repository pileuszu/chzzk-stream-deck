name: Build on Pull Request
on:
  pull_request:
    branches: [develop, main]
    paths-ignore: ['**.md']
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            command: npm run build:win
            artifact: dist/*.exe
          - os: macos-latest
            command: npm run build:mac
            artifact: dist/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          retention-days: 7
