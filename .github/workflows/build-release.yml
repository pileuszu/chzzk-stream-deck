name: Publish Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build and publish (for example v3.0.1)'
        required: true
        type: string
        default: v3.0.1

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      release_tag: ${{ inputs.tag || github.ref_name }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-package
          path: release
      - name: Verify and publish the built version
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS.txt
          filename="CHZZK-Stream-Deck-${RELEASE_TAG#v}-win-x64-portable.exe"
          test -f "$filename"
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "$filename" SHA256SUMS.txt \
            --verify-tag --title "CHZZK Stream Deck $RELEASE_TAG" \
            --notes-file RELEASE-NOTES.md "${options[@]}"
