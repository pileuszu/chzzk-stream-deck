<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:* http://127.0.0.1:*">
<link rel="preload" href="assets/fonts/pretendard/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>CHZZK Stream Deck</title><link rel="stylesheet" href="css/deck.css">
</head>
<body>
<main class="deck-shell">
<header class="deck-header" aria-label="창 이동 영역">
<div class="device-signature"><span class="brand-glyph" aria-hidden="true"><img src="icon.svg" alt="" draggable="false"></span><span><strong>CHZZK</strong> <b>Stream Deck</b></span></div>
<div class="header-page">
<button type="button" class="back-button" id="back-to-deck" title="모듈 목록으로 · Esc" aria-label="모듈 목록으로 돌아가기" hidden><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6M8 12h12"/></svg></button>
<div class="profile-label"><h1 id="screen-title">내 방송</h1><span id="screen-type" hidden>MAIN DECK</span></div>
</div>
<div class="window-controls" aria-label="앱 도구와 창 제어">
<button id="remove-page" title="빈 페이지 삭제" aria-label="빈 페이지 삭제" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7M14 10v7"/></svg></button>
<button id="edit-deck" aria-pressed="false" title="버튼 편집" aria-label="버튼 편집"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5 5 5M4 20l4-1L20 7a2 2 0 0 0-3-3L5 16l-1 4Z"/></svg></button>
<button data-window-action="toggle-pin" id="pin-window" title="항상 위에 표시" aria-label="항상 위에 표시" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m9 3 6 0-1 6 4 4v2H6v-2l4-4-1-6ZM12 15v6"/></svg></button><span class="control-divider"></span>
<button data-window-action="minimize" title="최소화" aria-label="최소화"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
<button data-window-action="toggle-maximize" id="maximize-window" title="최대화" aria-label="최대화"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
<button data-window-action="close" class="close-window" title="트레이로 숨기기 · 모듈 실행 유지" aria-label="트레이로 숨기기"><svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
</div></header>
<section class="deck-surface" aria-label="스트림덱 화면">
<p id="screen-feedback" class="screen-feedback" role="status" aria-live="polite" hidden></p>
<div class="screen-bed">
<section data-deck-view="home" id="module-list" aria-label="방송 모듈"><div class="key-grid" id="key-grid" role="toolbar" aria-label="5열 3행, 모듈 13칸과 11·15번 페이지 이동 슬롯. 방향키로 이동할 수 있습니다."></div></section>

</div>

</section>

</main>
<span id="deck-placement-status" class="sr-only" role="status" aria-live="polite"></span>
<div id="output-message" class="toast" role="status" aria-live="polite"></div>
<script src="shared/chat-config.js"></script><script src="js/config/constants.js"></script><script src="js/utils/settings.js"></script><script src="js/utils/ui.js"></script><script src="js/modules/chat.js"></script><script src="js/modules/outputs.js"></script><script type="module" src="js/main.js"></script>
</body></html>
